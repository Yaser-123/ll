name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Expo prebuild output
        uses: actions/cache@v4
        id: prebuild-cache
        with:
          path: android
          key: prebuild-${{ hashFiles('app.json', 'package-lock.json', 'modules/**', 'android/**') }}

      - name: Prebuild Expo (Generate Android native project)
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Cache C++ NDK Output
        uses: actions/cache@v4
        with:
          path: |
            android/app/.cxx
            node_modules/llama.rn/android/.cxx
          key: cxx-${{ hashFiles('package-lock.json', 'android/app/build.gradle') }}
          restore-keys: |
            cxx-

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache --parallel --daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeline-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
